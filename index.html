<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接口隐身工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 90%;
            margin: 20px auto;
            background: #f0f4f8;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        textarea, input {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }
        .admin-panel {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .tips {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>接口隐身工具</h1>
        <p class="tips">直播源、点播源一键隐身，支持在线修改，链接不变</p>

        <div id="loginForm">
            <h3>🔐 管理入口（需密码）</h3>
            <input type="password" id="adminPwd" placeholder="请输入管理密码">
            <button onclick="login()">进入管理后台</button>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h3>✏️ 编辑接口内容</h3>
            <textarea id="apiContent" rows="12" placeholder="粘贴你的接口内容，比如JSON/文本"></textarea>
            
            <div>
                <button onclick="saveContent()">保存修改</button>
                <button onclick="copyLink()">复制访问链接</button>
                <button onclick="location.reload()">刷新页面</button>
            </div>

            <p class="tips">✅ 提示：APP/影视仓直接访问本页面地址即可读取内容，修改后自动生效，链接不变</p>
        </div>
    </div>

    <script>
        // 🔑 这里改成你自己的密码！！！
        const CONFIG = {
            password: "123456", // 改成你自己的密码
        };

        // 读取本地存储的接口内容
        function getContent() {
            return localStorage.getItem("apiData") || "";
        }

        // 保存内容
        function saveContent() {
            const content = document.getElementById("apiContent").value;
            localStorage.setItem("apiData", content);
            alert("✅ 保存成功！APP访问链接已更新");
        }

        // 管理员登录
        function login() {
            const pwd = document.getElementById("adminPwd").value;
            if (pwd === CONFIG.password) {
                document.getElementById("adminPanel").style.display = "block";
                document.getElementById("apiContent").value = getContent();
            } else {
                alert("❌ 密码错误");
            }
        }

        // 复制当前页面链接
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("✅ 链接已复制，直接填到APP里即可");
        }

        // 页面加载时，自动输出接口内容给APP读取
        document.addEventListener("DOMContentLoaded", function() {
            // 如果不是管理员访问，直接输出内容
            if (!document.getElementById("adminPwd").value) {
                const content = getContent();
                if (content) {
                    document.body.innerHTML = content;
                }
            }
        });
    </script>
</body>
</html>
