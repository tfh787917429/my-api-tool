<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接口隐身工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 2.5em;
            margin: 0 0 15px;
        }
        .desc {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .password-section {
            margin-bottom: 30px;
        }
        .password-section h2 {
            font-size: 1.5em;
            margin: 0 0 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn {
            background: #1677ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: #4096ff;
        }
        .btn-secondary {
            background: #fa8c16;
        }
        .btn-secondary:hover {
            background: #ffa940;
        }
        .editor-section {
            display: none;
            margin-top: 30px;
        }
        .editor-section h2 {
            font-size: 1.5em;
            margin: 0 0 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            font-size: 1em;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: vertical;
        }
        .tip {
            color: #52c41a;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            background: #ff4d4f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            float: right;
        }
        /* 新增一键复制按钮 */
        .copy-btn {
            background: #52c41a;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>接口隐身工具</h1>
        <p class="desc">直播源、点播源一键隐身，支持在线修改，链接不变</p>

        <div class="password-section">
            <h2>🔐 管理入口（需密码）</h2>
            <input type="password" id="adminPassword" placeholder="请输入管理密码">
            <button class="btn" id="loginBtn">进入管理后台</button>
        </div>

        <div class="editor-section" id="editorSection">
            <h2>✏️ 编辑接口内容</h2>
            <textarea id="contentTextarea" placeholder="粘贴你的接口内容，比如JSON/文本"></textarea>
            <button class="btn" id="saveBtn">保存修改</button>
            <button class="btn" id="copyLinkBtn">复制访问链接</button>
            <button class="btn" id="refreshBtn">刷新页面</button>
            <button class="btn btn-secondary" id="openSecondaryBtn">二次生成</button>
        </div>

        <p class="tip">✅ 提示：APP/影视仓直接访问本页面地址即可读取内容，修改后自动生效，链接不变</p>
    </div>

    <div class="modal-overlay" id="secondaryModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">关闭</button>
            <h2>🪢 二次链接生成工具</h2>
            <p style="color: #666; margin-bottom: 20px;">🐦 自己设定文件名和密码，可上传.txt/.json文件，最大3M。</p>

            <div style="margin-bottom: 15px;">
                <label style="margin-right: 20px;">
                    <input type="radio" name="mode" id="textMode" checked> 文本模式
                </label>
                <label>
                    <input type="radio" name="mode" id="fileMode"> 上传文件
                </label>
            </div>

            <div id="textAreaContainer">
                <label>源文：</label>
                <textarea id="sourceText" rows="8" placeholder="请输入要生成链接的文本内容（如直播源、JSON配置等）"></textarea>
            </div>

            <div id="fileUploadContainer" style="display: none;">
                <label>上传文件：</label>
                <input type="file" id="fileInput" accept=".txt,.json">
            </div>

            <div style="margin: 15px 0;">
                <label>密码：</label>
                <input type="password" id="secondaryPassword" placeholder="请设置管理密码（请牢记！）" style="width: 100%; padding: 8px; box-sizing: border-box;">
                <span style="color: #666; font-size: 0.9em;">请牢记！！</span>
            </div>

            <div style="margin-bottom: 15px;">
                <label>文件名：</label>
                <input type="text" id="fileName" placeholder="请设置文件名（如 mylist.txt）" style="padding: 8px;">
                <button class="btn" id="readBtn">读取</button>
                <button class="btn" id="convertBtn">转为链接</button>
            </div>

            <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">👁️ 可在线编辑文件，原链接不变，需输入原密码。</p>

            <div>
                <label>链接：</label>
                <input type="text" id="resultLink" readonly style="width: 100%; padding: 10px; box-sizing: border-box;">
                <button class="copy-btn" id="copyResultBtn">一键复制链接</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "654321";
        const STORAGE_KEY = "apiToolContent";
        const storageKeyPrefix = 'apiTool_';

        // 处理链接参数输出内容给影视仓
        (function(){
            const urlParams = new URLSearchParams(window.location.search);
            const fileParam = urlParams.get('file');
            if(fileParam){
                let fname = decodeURIComponent(fileParam);
                let store = localStorage.getItem(storageKeyPrefix + fname);
                if(store){
                    let obj = JSON.parse(store);
                    document.body.innerHTML = obj.content;
                    return;
                }
            }
            // 无参数默认读取主内容
            if(!urlParams.get('file')){
                let mainTxt = localStorage.getItem(STORAGE_KEY) || "";
                if(mainTxt){
                    document.body.innerHTML = mainTxt;
                }
            }
        })();

        // 登录
        document.getElementById("loginBtn").addEventListener("click", function() {
            const inputPassword = document.getElementById("adminPassword").value;
            if (inputPassword === ADMIN_PASSWORD) {
                document.getElementById("editorSection").style.display = "block";
                const savedContent = localStorage.getItem(STORAGE_KEY) || "";
                document.getElementById("contentTextarea").value = savedContent;
            } else {
                alert("密码错误！");
            }
        });

        // 保存
        document.getElementById("saveBtn").addEventListener("click", function() {
            const content = document.getElementById("contentTextarea").value;
            localStorage.setItem(STORAGE_KEY, content);
            alert("保存成功！");
        });

        // 复制链接
        document.getElementById("copyLinkBtn").addEventListener("click", function() {
            const link = window.location.href.split('?')[0];
            navigator.clipboard.writeText(link).then(() => {
                alert("链接已复制到剪贴板！");
            }).catch(() => {
                alert("复制失败，请手动复制：" + link);
            });
        });

        // 刷新
        document.getElementById("refreshBtn").addEventListener("click", function() {
            location.reload();
        });

        // 二次弹窗
        document.getElementById("openSecondaryBtn").addEventListener("click", function() {
            document.getElementById("secondaryModal").style.display = "flex";
        });
        document.getElementById("closeModalBtn").addEventListener("click", function() {
            document.getElementById("secondaryModal").style.display = "none";
        });

        // 文本/文件切换
        const textMode = document.getElementById('textMode');
        const fileMode = document.getElementById('fileMode');
        const textAreaContainer = document.getElementById('textAreaContainer');
        const fileUploadContainer = document.getElementById('fileUploadContainer');

        textMode.addEventListener('change', () => {
            textAreaContainer.style.display = 'block';
            fileUploadContainer.style.display = 'none';
        });
        fileMode.addEventListener('change', () => {
            textAreaContainer.style.display = 'none';
            fileUploadContainer.style.display = 'block';
        });

        // 读取
        document.getElementById('readBtn').addEventListener('click', () => {
            const fileName = document.getElementById('fileName').value.trim();
            const password = document.getElementById('secondaryPassword').value.trim();
            if (!fileName || !password) {
                alert('请输入文件名和密码！');
                return;
            }
            const storedData = localStorage.getItem(storageKeyPrefix + fileName);
            if (!storedData) {
                alert('未找到该文件，请检查文件名是否正确！');
                return;
            }
            const parsed = JSON.parse(storedData);
            if (parsed.password !== password) {
                alert('密码错误！');
                return;
            }
            document.getElementById('sourceText').value = parsed.content;
            alert('读取成功！可修改后重新生成链接。');
        });

        // 转为链接
        document.getElementById('convertBtn').addEventListener('click', () => {
            const fileName = document.getElementById('fileName').value.trim();
            const password = document.getElementById('secondaryPassword').value.trim();
            let content = '';

            if (!fileName || !password) {
                alert('请输入文件名和密码！');
                return;
            }

            if (textMode.checked) {
                content = document.getElementById('sourceText').value.trim();
                if (!content) {
                    alert('请输入源文内容！');
                    return;
                }
                saveAndGenerateLink(fileName, password, content);
            } else {
                const fileInput = document.getElementById('fileInput');
                if (!fileInput.files[0]) {
                    alert('请选择要上传的文件！');
                    return;
                }
                const file = fileInput.files[0];
                if (file.size > 3 * 1024 * 1024) {
                    alert('文件大小不能超过3M！');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    content = e.target.result;
                    saveAndGenerateLink(fileName, password, content);
                };
                reader.readAsText(file);
            }
        });

        function saveAndGenerateLink(fileName, password, content) {
            const data = {
                content: content,
                password: password,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem(storageKeyPrefix + fileName, JSON.stringify(data));
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?file=${encodeURIComponent(fileName)}`;
            document.getElementById('resultLink').value = link;
            alert('链接生成成功！点击下方「一键复制链接」按钮即可复制。');
        }

        // 新增一键复制按钮功能
        document.getElementById("copyResultBtn").addEventListener("click", function() {
            const link = document.getElementById('resultLink').value;
            if(!link){
                alert('请先生成链接！');
                return;
            }
            navigator.clipboard.writeText(link).then(() => {
                alert("链接已复制到剪贴板！");
            }).catch(() => {
                alert("复制失败，请手动复制：" + link);
            });
        });
    </script>
</body>
</html>
